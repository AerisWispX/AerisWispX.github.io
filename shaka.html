<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --red:#e10600;
  --dark:#0c0f14;
  --light:#ffffff;
}

#loader{
  position:fixed;
  inset:0;
  background:#0a0a0a;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:32px;
  z-index:99999;
  overflow:hidden;
  font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,sans-serif;
  transition:opacity .5s ease, visibility .5s ease;
}

#loader::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:600px;
  height:600px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(225,6,0,.12) 0%, transparent 60%);
  pointer-events:none;
  animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
}

/* brand mark */
.brand{
  position:relative;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(28px,8vw,44px);
  letter-spacing:6px;
  color:#fff;
  opacity:0;
  animation:fadeUp .7s ease forwards;
}
.brand .accent{color:var(--red)}
.brand .dot{
  display:inline-block;
  width:6px;
  height:6px;
  background:var(--red);
  border-radius:50%;
  margin:0 4px 6px 4px;
  vertical-align:middle;
  box-shadow:0 0 12px var(--red);
  animation:blink 1.2s ease-in-out infinite;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

/* spinner ring */
.spinner{
  position:relative;
  width:44px;
  height:44px;
  opacity:0;
  animation:fadeUp .7s ease .15s forwards;
}
.spinner::before,
.spinner::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
}
.spinner::before{
  border:2px solid transparent;
  border-top-color:var(--red);
  border-right-color:var(--red);
  animation:spin 1s linear infinite;
}
.spinner::after{
  border:2px solid rgba(255,255,255,.06);
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* status text */
.status{
  position:relative;
  font-size:11px;
  letter-spacing:5px;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
  font-weight:600;
  opacity:0;
  animation:fadeUp .7s ease .3s forwards;
}

/* progress bar */
.progress{
  position:relative;
  width:min(220px,55vw);
  height:2px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  border-radius:2px;
  opacity:0;
  animation:fadeUp .7s ease .45s forwards;
}
.progress::before{
  content:"";
  position:absolute;
  top:0;
  left:-40%;
  height:100%;
  width:40%;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  animation:slide 1.6s ease-in-out infinite;
}
@keyframes slide{
  0%{left:-40%}
  100%{left:100%}
}

#loader.off{
  opacity:0;
  visibility:hidden;
}

body {
  position:absolute;
  margin: 0;
  padding: 0px;
  background-color: #000000;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  height:100%;
  width:100%;
}

.video-container {
  position: absolute;
  width: 100%;
  height:100%;
  aspect-ratio: 16/9;
  background-color: #000;
  border-radius: 1px;
  overflow: hidden;
  box-shadow: 0 4px 2px rgba(0,0,0,0.5);
}

.shaka-video-container {
  position: absolute;
  width: 100%;
  height:100%;
}

video {
  width: 100%;
  height: 100%;
  background-color: #000;
}

.video-watermark {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 80px;
  height: 10px;
  opacity: 0.7;
  z-index: 1000;
  pointer-events: none;
}

@media (max-width: 768px) {
  body {width:100%;height:100%;padding: 1px;}
  .video-container {max-width: 100%;height:100%}
  .video-watermark {width: 30px;height: 30px;top: 10px;left: 10px;}
}

@media (min-width: 769px) and (max-width: 1024px) {
  .video-container {max-width: 854px;}
}

.youtube-theme .shaka-seek-bar-container input[type=range]::-webkit-slider-thumb {background:#FF0000;cursor:pointer;}

.youtube-theme .shaka-overflow-menu,

.youtube-theme .shaka-settings-menu {padding:0 0 8px 0;}
.youtube-theme .shaka-settings-menu button {font-size:12px;}
.youtube-theme .shaka-settings-menu button span {margin-left:33px;font-size:13px;}

.youtube-theme .shaka-overflow-menu button {padding:0;}
.youtube-theme .shaka-overflow-menu button i {display:none;}
.youtube-theme .shaka-overflow-menu button .shaka-overflow-button-label {display:flex;justify-content:space-between;flex-direction:row;align-items:center;cursor:default;outline:none;height:60px;flex:0 0 100%;}
.youtube-theme .shaka-overflow-menu button .shaka-overflow-button-label span {flex-shrink:initial;padding-left:15px;font-size:13px;font-weight:500;display:flex;align-items:center;}
.youtube-theme .shaka-overflow-menu span + span {color:#FFF;font-weight:400!important;font-size:12px!important;padding-right:8px;padding-left:0!important;}

.youtube-theme .shaka-back-to-overflow-button .material-icons-round {font-size:15px;padding-right:10px;}
.youtube-theme .shaka-back-to-overflow-button span {margin-left:3px!important;}
.youtube-theme .shaka-overflow-menu button:hover,
